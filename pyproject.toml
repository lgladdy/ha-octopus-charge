[project]
name = "ha-octopus-charge"
version = "0.0.0"
description = "Home Assistant integration for the Octopus Charge home EV charger"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
